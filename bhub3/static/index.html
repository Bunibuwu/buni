function xhr(path,fd,prog){return new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open('POST','/api'+path);x.setRequestHeader('X-Token',TOKEN);x.upload.onprogress=e=>{if(e.lengthComputable&&prog)prog(e.loaded/e.total)};x.onload=()=>{let d={};try{d=JSON.parse(x.responseText)}catch{}x.status<300?ok(d):no(new Error(d.error||(x.status==413?'That file is too large':'Upload failed')))};x.onerror=()=>no(new Error('Upload failed'));x.send(fd)})}

async function fileMeta(){const f=$('#uf').files[0];S.updur='';S.upthumb=null;if(!f)return;const v=document.createElement('video');v.muted=true;v.preload='metadata';v.src=URL.createObjectURL(f);
 await new Promise(r=>{v.onloadedmetadata=r;v.onerror=r;setTimeout(r,4000)});if(isFinite(v.duration)&&v.duration>0){S.updur=tf(v.duration);v.currentTime=Math.min(1,v.duration/2);await new Promise(r=>{v.onseeked=r;setTimeout(r,3000)});
  try{const c=document.createElement('canvas');c.width=480;c.height=Math.round(480*(v.videoHeight||9)/(v.videoWidth||16));c.getContext('2d').drawImage(v,0,0,c.width,c.height);S.upthumb=await new Promise(r=>c.toBlob(r,'image/jpeg',.8))}catch{}}
 const t=$('#ut');t&&!t.value&&(t.value=f.name.replace(/\.[^.]+$/,''));const m=$('#um');m&&(m.textContent=S.updur?`Duration ${S.updur}${S.upthumb?' · thumbnail ready':''}`:'')}
async function imgUp(el){const f=el.files[0];if(!f)return;const fd=new FormData();fd.append('file',f);toast('Uploading…');Object.assign(S.me,await xhr('/me/'+el.dataset.w,fd));shell();route()}
const zone=(t,e)=>{const r=t.getBoundingClientRect(),y=(e.clientY-r.top)/r.height,c=S.sd.channels.find(x=>x.id==+t.dataset.drag);return c.kind=='category'?(y<.3?'b':'i'):(y<.5?'b':'a')};
const clearDz=()=>$$('.dz-b,.dz-a,.dz-i').forEach(x=>x.classList.remove('dz-b','dz-a','dz-i'));
document.addEventListener('dragstart',e=>{const t=e.target.closest&&e.target.closest('[data-drag]');if(!t)return;S.drag=+t.dataset.drag;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(S.drag))});
document.addEventListener('dragover',e=>{if(!S.drag)return;const t=e.target.closest('[data-drag]'),root=e.target.closest('[data-root]');if(!t&&!root)return;e.preventDefault();clearDz();if(t&&+t.dataset.drag!=S.drag)t.classList.add('dz-'+zone(t,e))});
document.addEventListener('dragend',()=>{S.drag=0;clearDz()});
document.addEventListener('drop',async e=>{if(!S.drag)return;e.preventDefault();const id=S.drag,t=e.target.closest('[data-drag]'),z=t&&zone(t,e);S.drag=0;clearDz();if(t&&+t.dataset.drag==id)return;
 const ch=S.sd.channels;let parent=null,idx=ch.filter(x=>!x.parent&&x.id!=id).length;if(t){const tg=ch.find(x=>x.id==+t.dataset.drag);if(z=='i'){parent=tg.id;idx=ch.filter(x=>x.parent==tg.id&&x.id!=id).length}else{parent=tg.parent||null;idx=ch.filter(x=>(x.parent||null)==parent&&x.id!=id).findIndex(x=>x.id==tg.id)+(z=='a'?1:0)}}
 try{await api(`/servers/${S.sd.id}/move`,'POST',{id,parent,index:idx});route()}catch(err){toast(err.message)}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]'),u=e.target.closest('[data-user]');
 if(!e.target.closest('#pop,[data-user],[data-act=chmenu],[data-act=addIn]'))hidePop();if(!e.target.closest('#ac,input,textarea'))$('#ac').classList.remove('on');
 if(u&&(!b||(b!==u&&b.contains(u)))){e.preventDefault();e.stopPropagation();return userCard(u.dataset.user,e.clientX,e.clientY).catch(err=>toast(err.message))}
 if(!b){if(!e.target.closest('#pm,[data-act=pm],#emp'))$('#pm').classList.remove('on');if(!e.target.closest('#emp,[data-act=emo]'))$('#emp').classList.remove('on');return}
 if(b.closest('#emp')&&!['emoPick','emoTab'].includes(b.dataset.act))return;const f=H[b.dataset.act];if(!f)return;if(b.tagName=='A')e.preventDefault();e.stopPropagation();try{await f(b,e)}catch(err){toast(err.message)}});

async function secBar(){const c=window.SRV=await fetch('/api/config').then(r=>r.json()).catch(()=>({}));if(window.isSecureContext||sessionStorage.nosec||$('#sec'))return;const u=c.https_port?`https://${location.hostname}:${c.https_port}/`:'';const b=document.createElement('div');b.id='sec';
 b.innerHTML=`<span class="g"><b>Camera, microphone and screen sharing are blocked on http.</b> ${u?`Open the secure version: <a href="${u}" style="text-decoration:underline"><b>${u}</b></a> (log in again there, and accept the one-time certificate warning).`:'Use an https address (for example a cloudflared tunnel) to enable them.'}</span><button class="ib" data-act="hideSec" style="background:#0003;color:#fff">${ic('x','s')}</button>`;document.body.insertBefore(b,document.body.firstChild)}
H.hideSec=()=>{sessionStorage.nosec=1;const b=$('#sec');b&&b.remove()};
/* ============ v3: camera + notification settings, call volume/minimize, shorts volume/share, achievements, previews ============ */
const CAMS=()=>Object.assign({dev:'',height:0,fps:0,mirror:true},JSON.parse(localStorage['bhub.cam']||'{}'));
const camSave=o=>localStorage['bhub.cam']=JSON.stringify(Object.assign(CAMS(),o));
async function getCam(){const V=RTC.video||{},C=CAMS(),h=C.height||V.camera_height||720,f=C.fps||V.camera_fps||30,c=d=>({video:{deviceId:d?{exact:d}:undefined,width:{ideal:Math.round(h*16/9)},height:{ideal:h},frameRate:{ideal:f}}});
 try{return await navigator.mediaDevices.getUserMedia(c(C.dev))}catch(e){if(C.dev){camSave({dev:''});return navigator.mediaDevices.getUserMedia(c(''))}throw e}}
const camTab=()=>{const c=CAMS();return`${hasMedia()?'':'<div class="card pad" style="margin-bottom:12px;border-color:var(--bad)"><b>Camera unavailable</b><p class="m">Browsers only allow the camera on HTTPS or localhost. Open the https version of bHub (see the orange bar).</p></div>'}
 <div class="card pad" style="margin-bottom:12px"><b>Camera</b><label class="fl">Device</label><select id="cdev" data-change="camChange"><option value="">Default</option></select>
 <div class="row wrap"><div class="g"><label class="fl">Resolution</label><select id="chh" data-change="camChange">${[[0,'Server default'],[480,'480p'],[720,'720p HD'],[1080,'1080p Full HD']].map(([v,t])=>`<option value="${v}" ${c.height==v?'selected':''}>${t}</option>`).join('')}</select></div><div class="g"><label class="fl">Frame rate</label><select id="cfp" data-change="camChange">${[[0,'Server default'],[15,'15 fps'],[24,'24 fps'],[30,'30 fps'],[60,'60 fps']].map(([v,t])=>`<option value="${v}" ${c.fps==v?'selected':''}>${t}</option>`).join('')}</select></div></div>
 <div class="row" style="padding:12px 0 0"><div class="g"><b>Mirror my video</b><div class="m">Flips only your own view, like a mirror. Others always see you the right way round.</div></div><button class="tog ${c.mirror?'on':''}" data-act="camTog"></button></div></div>
 <div class="card pad"><b>Preview</b><div class="player mirrorbox ${c.mirror?'mirror':''}" style="margin:10px 0"><video id="cprev" muted autoplay playsinline style="transform:${c.mirror?'scaleX(-1)':'none'}"></video></div><button class="btn o" data-act="camPrev" id="cpb">Start preview</button></div>`};
async function camInit(){if(!navigator.mediaDevices||!navigator.mediaDevices.enumerateDevices)return;const d=await navigator.mediaDevices.enumerateDevices(),c=CAMS(),el=$('#cdev');el&&(el.innerHTML='<option value="">Default</option>'+d.filter(x=>x.kind=='videoinput').map((x,i)=>`<option value="${x.deviceId}" ${c.dev==x.deviceId?'selected':''}>${esc(x.label||'Camera '+(i+1))}</option>`).join(''))}
async function camChange(){camSave({dev:$('#cdev').value,height:+$('#chh').value,fps:+$('#cfp').value});if(S.cp){await H.camPrev();await H.camPrev()}if(CALL.room&&CALL.cam){await camOn(false);await camOn(true);refreshCtl()}toast('Camera settings saved')}
const NT=[['n_dm','Direct messages','Someone sends you a message'],['n_mention','Mentions','Someone @mentions you'],['n_reply','Replies and comments','Replies to your comments, posts and videos'],['n_like','Likes','Someone likes your post'],['n_follow','New followers','Someone follows you'],['n_friend','Friend requests','Requests and accepted requests'],['n_call','Incoming calls','Someone calls you'],['n_system','Updates','Orders and moderator notices']];
function notifyClient(c){const s=S.me.settings||{};if(s.dnd)return;if(s.n_sound!==false){try{const a=new Audio(wavBeep());a.volume=.5;applyOut(a);a.play().catch(()=>{})}catch{}}if(s.n_desktop&&'Notification' in window&&Notification.permission=='granted'&&document.hidden){try{new Notification('bHub',{body:c.text})}catch{}}}
addEventListener('hashchange',()=>{if(S.cp){S.cp.getTracks().forEach(t=>t.stop());S.cp=null}});
document.addEventListener('input',e=>{const t=e.target;if(!t.classList)return;if(t.classList.contains('cvol')){CALL.vol=+t.value;localStorage['bhub.callvol']=CALL.vol;$$('.cvol').forEach(x=>x!==t&&(x.value=CALL.vol));syncAudio()}
 if(t.classList.contains('rvol')){S.rvol=+t.value;localStorage['bhub.rvol']=S.rvol;if(S.rvol>0&&S.rmute){S.rmute=false;localStorage['bhub.rmute']='0'}$$('#reel video').forEach(v=>{v.volume=S.rvol;v.muted=S.rmute});const b=$('#reel [data-act=reelMute]');b&&(b.innerHTML=ic(S.rmute||S.rvol==0?'volx':'spk'))}});
Object.assign(H,{
 setting:async b=>{const k=b.dataset.k,on=!b.classList.contains('on');if(k=='n_desktop'&&on){if(!('Notification' in window))return toast('Your browser does not support desktop notifications');if(await Notification.requestPermission()!='granted')return toast('The browser blocked notifications. Allow them in the site settings.')}
  Object.assign(S.me,await api('/me','PUT',{settings:k=='theme_dark'?{theme:on?'dark':'light'}:{[k]:on}}));applySettings();b.classList.toggle('on',on)},
 camTog:b=>{camSave({mirror:!CAMS().mirror});b.classList.toggle('on',CAMS().mirror);const v=$('#cprev');v&&(v.style.transform=CAMS().mirror?'scaleX(-1)':'none');tiles()},
 camPrev:async()=>{const v=$('#cprev'),b=$('#cpb');if(S.cp){S.cp.getTracks().forEach(t=>t.stop());S.cp=null;v&&(v.srcObject=null);b&&(b.textContent='Start preview');return}if(!hasMedia())return toast('The camera needs HTTPS or localhost');try{S.cp=await getCam();v.srcObject=S.cp;b.textContent='Stop preview';camInit()}catch{toast('Could not open the camera. Check the permission prompt.')}},

 joinVoice:async b=>{const c=S.sd&&S.sd.channels.find(x=>x.id==+b.dataset.id);await joinCall('c'+b.dataset.id,{min:true,label:(S.sd?S.sd.name+' · ':'')+(c?c.name:'Voice')});toast('Joined voice. Use the small call window to mute, share or leave.')},

 reelShare:async b=>{const url=location.origin+'/#/content/short/'+b.dataset.id,c=(S.shorts||[]).find(x=>x.id==b.dataset.id)||{};if(navigator.share){try{await navigator.share({title:c.title||'Short on bHub',url});return}catch(e){if(e.name=='AbortError')return}}navigator.clipboard&&navigator.clipboard.writeText(url);toast('Short link copied')},
